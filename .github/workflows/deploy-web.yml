name: Deploy redistricting web

on:
  push:
    branches: [master, main]
    paths:
      - 'web/**'
      - 'evaluate/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-redistricting-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH_OPTS=(-i /tmp/deploy_key -o StrictHostKeyChecking=no)

          rsync -az --delete \
            -e "ssh ${SSH_OPTS[*]}" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='storage' \
            --exclude='seeds/*.csv' \
            web/ "$SSH_USER@$SSH_HOST:/var/www/redistricting/web/"

          rsync -az --delete \
            -e "ssh ${SSH_OPTS[*]}" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            evaluate/ "$SSH_USER@$SSH_HOST:/var/www/redistricting/evaluate/"

          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" bash <<'REMOTE'
          set -euo pipefail
          cd /var/www/redistricting
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/pip install --upgrade pip wheel >/dev/null
          .venv/bin/pip install -r web/requirements.txt
          .venv/bin/pip install pandas numpy scipy matplotlib geopandas
          mkdir -p storage/images
          chown -R www-data:www-data storage
          systemctl restart redistricting
          systemctl is-active redistricting
          REMOTE

          rm /tmp/deploy_key
